name: Frontend - Blob storage website CI

on:
  push:
    branches: [ master ]
        
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: azure/login@v1
      with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Upload to blob storage
      uses: azure/CLI@v1
      with:
        inlineScript: |
            az storage blob upload-batch --account-name azureresumeacc666 --auth-mode key --overwrite -d '$web' -s .
    - name: Purge CDN endpoint
      uses: azure/CLI@v1
      with:
        inlineScript: |
           az cdn endpoint purge --content-paths  "/*" --profile-name "azureresumeCDNwebsite" --name "azureresumeacc666" --resource-group "resumecloud"

  # Azure logout
    - name: logout
      run: |
            az logout
      if: always()